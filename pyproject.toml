[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadpipe"
version = "1.0.0"
description = "24/7 lead generation and sales pipeline: find leads, audit, write, send, follow up, handle replies, onboard clients."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "dnspython>=2.6",
  "PyYAML>=6.0",
  "Flask>=3.0",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
  "waitress>=3.0",
  "phonenumbers>=8.13",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3", "markdown>=3.5"]

[project.scripts]
leadpipe = "leadpipe.cli:main"

[tool.setuptools.packages.find]
include = ["leadpipe*"]

[tool.setuptools.package-data]
leadpipe = ["default_config.yaml", "dashboard/templates/*.html", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
