# =====================================================================
#  LeadAutomationPipeline: main settings file
#
#  Easiest: open the dashboard → Settings → Setup and fill in the form
#  (it edits this file for you). Or edit config.yaml by hand.
#  Secrets (passwords, API keys) go in .env, never here.
# =====================================================================

# ---------------------------------------------------------------------
# 1. WHO YOU ARE. Every message is written from this. Be specific.
#    Rule from the playbooks: show, don't claim. Real numbers beat adjectives.
# ---------------------------------------------------------------------
profile:
  your_name: "Your Name"
  business_name: "Your Studio"
  website: "https://yourstudio.com"
  # What you sell, in the words a business owner would use.
  service: "websites with online booking"
  service_long: "I build fast, mobile-friendly websites with online booking for local businesses."
  # What kind of service this is: website | automation | marketing | seo | reviews | custom.
  # It sets which problems make a good lead and how fixes are worded. "custom" = use the `signals:` weights below.
  service_type: "website"
  # The quick, low-risk first project you offer.
  starter_offer: "a booking-ready one-page website in 5 days"
  # Only used when someone asks "how much?". Never in a first message.
  price_range: "₹8,000 to ₹15,000"
  delivery_time: "5 to 7 working days"
  # Credibility: 1-3 short, relevant, provable results, written as "built ...", "helped ...". [] if none yet.
  proof:
    - "built booking websites for 12 local clinics"
  # Optional: more relevant proof per business type (used instead of the line above for that category).
  proof_by_category: {}               # e.g. {dentist: "built booking sites for 5 dental clinics"}
  proof_links: []                     # portfolio / case-study URLs
  # The "extra effort" you offer for free to start a conversation.
  quick_win: "a free 2-minute video audit of your website"
  quick_win_no_site: "a free mock-up of a simple website for you"   # for leads with no website
  # Your calendar link (Cal.com / Calendly / Google Calendar booking page).
  booking_link: "https://cal.com/your-name/15min"
  signature: |
    Your Name
    Your Studio | yourstudio.com
  # A real postal address. Required by US CAN-SPAM in every commercial email.
  physical_address: "Your Studio, Your Street, Your City, PIN, Country"

# ---------------------------------------------------------------------
# 2. WHO TO REACH, AND WHERE. Start with one area, finish it, then move on
#    to the next one automatically: your country first, then the world.
# ---------------------------------------------------------------------
reach:
  auto_discover: true                 # find new businesses automatically, 24/7
  # Business types to look for in every area. `leadpipe categories` lists them,
  # or use an OpenStreetMap tag like "shop=bicycle".
  business_types: ["dentist", "clinic", "salon", "gym", "cafe"]
  start_area: "Surat, India"          # "City, Country"
  next_areas: []                      # optional: your own order after the start area, e.g. ["Ahmedabad, India", "Dubai, UAE"]
  world_rollout: true                 # after those: the rest of your country, then the countries below, city by city
  countries: ["AE", "GB", "US", "AU", "CA", "SG", "NZ", "IE", "SA", "QA", "ZA", "MY"]
  skip_countries: []                  # never search here (see docs/LEGAL_AND_COMPLIANCE.md)
  tiles_per_area: 9                   # big cities are searched piece by piece (3 x 3 grid)
  results_per_search: 250
  min_ready_leads: 40                 # search the next piece only when fewer fresh leads than this are waiting

# Where leads come from. OpenStreetMap is free. The others are optional.
sources:
  providers: ["osm"]                  # osm | serper (SERPER_API_KEY, 2,500 free searches) | google_places (GOOGLE_PLACES_API_KEY)
  google_sheets: []                   # sheets to import and re-sync every few hours, e.g.
                                      #   - {url: "https://docs.google.com/spreadsheets/d/.../edit#gid=0", priority: true}
                                      # The sheet must be shared as "Anyone with the link can view".
  sheet_sync_hours: 6

# ---------------------------------------------------------------------
# 3. RESEARCH & QUALIFYING. The "Auditor" reads each website (no AI cost).
# ---------------------------------------------------------------------
enrichment:
  per_cycle: 15                       # websites checked per cycle
  request_timeout: 12
  max_pages_per_site: 6
  max_contacts_per_company: 2         # never email more than 2 people at one company
  allow_role_emails: true             # info@ / contact@ (fine for small local businesses)
  allow_pattern_emails: true          # owner's address worked out from the company's own email pattern
  allow_guessed_emails: false         # blind firstname@domain guesses. Risky for bounces; keep off.
  smtp_probe: false                   # RCPT TO mailbox check. Port 25 is blocked on most networks.
  min_score: 25                       # leads scoring below this are not contacted
  priority_bonus: 30                  # extra score for leads you marked high-value (imports)
  hiring_roles: []                    # roles that mean "they're buying", e.g. ["marketing", "receptionist"]

# What makes a business a GOOD lead for YOU. Weight 0 = ignore, higher = more important.
# Used when profile.service_type is "custom" (otherwise the service type's weights apply; the dashboard
# writes them here when you pick a type, so you can fine-tune them). `leadpipe signals` explains each one.
signals:
  no_website: 25
  site_broken: 20
  instagram_only: 20
  no_online_booking: 20
  not_mobile_friendly: 15
  slow_site: 10
  no_https: 10
  outdated_site: 10
  running_ads: 10
  diy_builder: 5
  hiring: 5
  no_contact_form: 5
  weak_seo: 5
  no_analytics: 5
  low_rating: 5
  few_reviews: 5
  blog_stale: 0
  no_schema_markup: 0
  agency_built: 0
  no_live_chat: 0
  startup_backed: 0
  recently_funded: 0

# ---------------------------------------------------------------------
# 4. CHANNELS. Email is sent automatically. WhatsApp, Instagram, LinkedIn,
#    X, Facebook and calls become one-click tasks on your To-do page
#    (message written for you; you press send / dial). See the user guide.
# ---------------------------------------------------------------------
channels:
  enabled: ["email", "whatsapp", "call", "instagram", "linkedin", "twitter", "facebook"]
  dm_order: ["whatsapp", "instagram", "linkedin", "facebook", "twitter"]   # which app to use first for a DM
  tasks_per_day: 25                   # max DM + call tasks per day (best leads first)
  min_score_for_tasks: 40             # extra DMs/calls to email leads only when they score at least this
  call_attempts: 2                    # "no answer" → try again next day, this many times in total

# ---------------------------------------------------------------------
# 5. SENDING. Starts in dry_run: nothing leaves your computer until you switch to smtp.
#    The main mailbox login lives in .env. Add more mailboxes below to send more per day.
# ---------------------------------------------------------------------
sending:
  mode: dry_run                       # dry_run (saves .eml files to data/dry_run) | smtp (real emails)
  daily_cap: 40                       # per mailbox, after warm-up
  warmup:
    enabled: true
    start_date: ""                    # YYYY-MM-DD you started sending; blank = the first send day
    start_per_day: 5
    increase_per_day: 2               # 5, 7, 9, ... until daily_cap
  new_leads_per_day: 15               # new people per day, all mailboxes together (follow-ups always go first)
  office_hours:                       # in the RECIPIENT's timezone
    start: "09:30"
    end: "17:30"
    days: ["mon", "tue", "wed", "thu", "fri"]
  min_gap_minutes: 3                  # random pause between two emails from one mailbox (human speed)
  max_gap_minutes: 9
  one_company_per_day: true           # never email two people at the same company on the same day

# Extra sending mailboxes (each warms up and has its own daily cap). Passwords go in .env under password_env.
#   - {name: "second", email: "you@getyourstudio.co", from_name: "Your Name", smtp_host: "smtp.gmail.com",
#      smtp_port: 587, smtp_security: starttls, imap_host: "imap.gmail.com", password_env: "MAILBOX2_PASSWORD"}
mailboxes: []

approval:
  autopilot_cold: false               # false = every outreach email waits on your To-do page for your OK
  autopilot_replies: false            # false = every reply to a real human waits for your OK
  draft_ahead_hours: 24               # write drafts this early so you can review them in time

# ---------------------------------------------------------------------
# 6. FOLLOW-UP TRACKS. `day` = days after the track started.
#    channel: email | dm (best available app) | call | whatsapp | instagram | linkedin | twitter | facebook
#    Email steps fall back to a DM, then a call, when the lead has no email address.
#    on_complete: what happens after the last step + close_after_days of silence: lost | nurture | none
# ---------------------------------------------------------------------
sequences:
  cold:                               # has an email address, never replied (playbook: day 0/3/7/12/18)
    on_complete: lost
    close_after_days: 7
    steps:
      - {day: 0,  purpose: intro,      channel: email}   # observation + their loss + one soft question
      - {day: 3,  purpose: bump,       channel: email}   # 1-2 lines, one small new detail
      - {day: 5,  purpose: call_intro, channel: call}    # good leads only (min_score_for_tasks)
      - {day: 7,  purpose: insight,    channel: email}   # a NEW observation
      - {day: 10, purpose: dm_touch,   channel: dm}      # short note on WhatsApp/Instagram/LinkedIn (good leads only)
      - {day: 12, purpose: value,      channel: email}   # offer the quick win
      - {day: 18, purpose: breakup,    channel: email}   # polite close, door left open
  cold_social:                        # no email address: DMs and calls only (tasks for you)
    on_complete: lost
    close_after_days: 7
    steps:
      - {day: 0,  purpose: dm_intro,    channel: dm}
      - {day: 2,  purpose: call_intro,  channel: call}
      - {day: 6,  purpose: dm_followup, channel: dm}
      - {day: 13, purpose: dm_final,    channel: dm}
  warm:                               # replied "interested" but no call booked yet
    on_complete: nurture
    close_after_days: 5
    steps:
      - {day: 2,  purpose: booking_nudge, channel: email}
      - {day: 4,  purpose: call_followup, channel: call}
      - {day: 6,  purpose: proof,         channel: email}
      - {day: 10, purpose: close_loop,    channel: email}
  proposal:                           # had a call / asked for a proposal, no decision yet
    on_complete: nurture
    close_after_days: 7
    steps:
      - {day: 2,  purpose: proposal_followup, channel: email}
      - {day: 4,  purpose: call_followup,     channel: call}
      - {day: 6,  purpose: objection_preempt, channel: email}
      - {day: 10, purpose: decision_nudge,    channel: email}
      - {day: 21, purpose: close_file,        channel: email}
  nurture:                            # "not now" / "we already have someone"
    on_complete: lost
    close_after_days: 14
    steps:
      - {day: 30, purpose: nurture_value, channel: email}
      - {day: 60, purpose: nurture_idea,  channel: email}
      - {day: 90, purpose: nurture_final, channel: email}
  client_care:                        # after onboarding is complete (retention + referrals)
    on_complete: none
    close_after_days: 0
    steps:
      - {day: 14,  purpose: care_checkin,  channel: email}
      - {day: 30,  purpose: care_feedback, channel: email}
      - {day: 60,  purpose: care_referral, channel: email}
      - {day: 120, purpose: care_next,     channel: email}

# ---------------------------------------------------------------------
# 7. CLIENT ONBOARDING (Contract > Payment > Welcome > Kickoff > Access > Portal).
#    Starts when you mark a deal as WON.
# ---------------------------------------------------------------------
onboarding:
  contract_link: ""                   # e-sign link (Zoho Sign, DocuSign, PandaDoc). Blank = "attached".
  payment_link: ""                    # Razorpay / Stripe / PayPal / UPI link
  welcome_doc_link: ""                # see docs/templates/welcome_document.md
  kickoff_link: ""                    # blank = profile.booking_link
  portal_link: ""                     # Notion page / Google Drive folder for the client
  reminder_every_days: 2
  max_reminders: 3
  access_items:
    - "Domain / hosting access (please invite me as a user, never share passwords on chat)"
    - "Google Business Profile: add me as a Manager"
    - "Logo and brand files (colours, fonts)"
    - "Google Analytics and Search Console: add me as a user"

# ---------------------------------------------------------------------
# 8. REPLIES & ALERTS
# ---------------------------------------------------------------------
replies:
  ooo_delay_days: 4                   # out-of-office auto-reply: push the next follow-up by N days
  reply_to_not_interested: true       # send a short, polite "understood, thanks" (still needs approval)
  stop_company_on_reply: true         # anyone at the company replies -> stop emailing the others

notifications:
  owner_email: ""                     # hot-lead alerts + daily digest go here (blank = off)
  daily_digest_hour: 19               # local hour (engine timezone) for the daily summary
  # Optional: NOTIFY_WEBHOOK_URL (Slack/Discord) and TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env

# ---------------------------------------------------------------------
# 9. AI (optional). Without AI, high-quality built-in templates are used.
#    auto = Anthropic API if ANTHROPIC_API_KEY is set, else the `claude` CLI
#    (uses your Claude Pro/Max plan), else templates.
# ---------------------------------------------------------------------
llm:
  provider: auto                      # auto | anthropic | claude_cli | none
  model: "claude-opus-5-5"
  cli_model: ""                       # optional model for the claude CLI (blank = your CLI default)
  effort_writing: medium
  effort_classify: low
  timeout_seconds: 180
  max_calls_per_day: 400              # AI budget; after this, templates are used until tomorrow

# ---------------------------------------------------------------------
# 10. SAFETY & LEGAL CHECKS, run on every message before it can be sent.
#    Read docs/LEGAL_AND_COMPLIANCE.md. This is not legal advice.
# ---------------------------------------------------------------------
compliance:
  include_address: true
  opt_out_line: "P.S. If this isn't relevant, just reply \"no thanks\" and I won't email again."
  restricted_countries: []            # ISO codes never contacted at all, e.g. ["DE", "CA"]
  max_links_first_email: 0
  max_links_followup: 1
  extra_banned_phrases: []            # add your own

# ---------------------------------------------------------------------
# 11. ENGINE & DASHBOARD
# ---------------------------------------------------------------------
engine:
  timezone: "Asia/Kolkata"            # YOUR timezone (digest time, "today" counters)
  tick_seconds: 60
  inbox_every_minutes: 5
  write_every_minutes: 10
  enrich_every_minutes: 15
  discover_every_minutes: 30
  keep_awake: true                    # stop the computer from sleeping while the engine runs

dashboard:
  host: "127.0.0.1"                   # 0.0.0.0 to open it to your network/phone (then DASHBOARD_PASSWORD is required)
  port: 8787
  public_base_url: ""                 # e.g. https://leads.yourdomain.com: enables one-click unsubscribe + booking webhook
